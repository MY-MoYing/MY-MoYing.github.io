<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>选择性必修一 · TAG猜术语 · 期中考复习题库</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --ink:#1c2024;
    --ink-2:#4a5158;
    --ink-3:#7d858d;
    --line:#e3e6ea;
    --brand:#0f766e;
    --warn:#b45309;
    --warn-bg:#fff7ed;
    --ok:#047857;
    --ch1:#0d9488;
    --ch2:#4338ca;
    --ch3:#c2410c;
    --ch4:#7c3aed;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:#fff;border-bottom:1px solid var(--line);
    padding:14px 24px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  }
  header h1{font-size:19px;margin:0;letter-spacing:.5px;}
  header .sub{font-size:13px;color:var(--ink-3);}
  .bar{
    background:#fff;border-bottom:1px solid var(--line);
    padding:10px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    position:sticky;top:0;z-index:20;
  }
  button,.tab{
    font-family:inherit;font-size:13px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink-2);
    padding:6px 13px;border-radius:999px;transition:.15s;
  }
  button:hover,.tab:hover{border-color:#b9bfc6;color:var(--ink);}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tab.on.c1{background:var(--ch1);border-color:var(--ch1);}
  .tab.on.c2{background:var(--ch2);border-color:var(--ch2);}
  .tab.on.c3{background:var(--ch3);border-color:var(--ch3);}
  .tab.on.c4{background:var(--ch4);border-color:var(--ch4);}
  .spacer{flex:1;}
  .counter{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  label.chk{font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;cursor:pointer;}

  /* ---------- 单卡投屏 ---------- */
  #stage{padding:26px 24px 60px;display:flex;justify-content:center;}
  .stage-card{
    width:100%;max-width:940px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;box-shadow:0 6px 24px rgba(20,25,35,.06);
    overflow:hidden;
  }
  .sc-top{padding:18px 30px 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .chip{font-size:12px;padding:4px 11px;border-radius:6px;background:#f1f3f5;color:var(--ink-2);}
  .chip.ch{color:#fff;font-weight:600;letter-spacing:.5px;}
  .chip.core{background:#fff7e6;color:#92400e;border:1px solid #fcd9a0;}
  .sc-body{padding:16px 30px 26px;}
  .ask{font-size:16px;color:var(--ink-3);letter-spacing:1px;margin-bottom:16px;}
  .tags{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .tag{
    font-size:26px;line-height:1.35;font-weight:700;letter-spacing:.5px;
    padding:12px 20px;border-radius:12px;border:2px dashed;border-style:dashed;
  }
  .reveal-slot{min-height:132px;}
  .reveal-btn{
    width:100%;border:2px dashed #cfd5db;background:#fafbfc;color:var(--ink-3);
    border-radius:12px;padding:40px 20px;font-size:19px;letter-spacing:3px;
  }
  .reveal-btn:hover{border-color:var(--brand);color:var(--brand);background:#f0fbf9;}
  .ans-box{border-radius:12px;padding:20px 24px;background:#f8fafb;border:1px solid var(--line);}
  .ans-name{font-size:36px;font-weight:800;letter-spacing:1px;line-height:1.25;}
  .ans-meta{font-size:13px;color:var(--ink-3);margin-top:6px;letter-spacing:.5px;}
  .sec{margin-top:16px;font-size:15px;line-height:1.85;color:var(--ink-2);}
  .sec b{color:var(--ink);font-weight:700;}
  .sec-head{
    display:inline-block;font-size:12px;letter-spacing:1px;margin-bottom:5px;
    padding:2px 9px;border-radius:5px;background:#eef2f5;color:var(--ink-2);
  }
  .sec.trap{background:var(--warn-bg);border:1px solid #fcd9a0;border-radius:10px;padding:14px 18px;margin-top:14px;}
  .sec.trap .sec-head{background:#fde9c8;color:#92400e;}
  .sc-foot{
    padding:14px 30px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;
    background:#fbfcfd;
  }
  .sc-foot button{padding:8px 18px;font-size:14px;}
  .dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;flex:1;}
  .dot{width:7px;height:7px;border-radius:50%;background:#d3d8dd;cursor:pointer;}
  .dot.now{background:var(--ink);transform:scale(1.5);}
  .dot.done{background:#9aa3aa;}

  /* ---------- 总表 ---------- */
  #list{padding:20px 24px 60px;display:none;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px;}
  .mini{
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    display:flex;flex-direction:column;gap:9px;
  }
  .mini .m-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .mini .num{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;}
  .mini .m-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .mini .m-tag{font-size:13px;font-weight:600;padding:3px 9px;border-radius:6px;background:#f1f3f5;color:var(--ink-2);}
  .m-ans{
    font-size:19px;font-weight:800;padding:9px 12px;border-radius:8px;
    background:#eeeef0;color:transparent;user-select:none;cursor:pointer;letter-spacing:.5px;
  }
  .m-ans.open{background:#e8f6f2;color:var(--ok);}
  .m-exp{font-size:13px;line-height:1.75;color:var(--ink-2);}
  .m-trap{font-size:13px;line-height:1.7;color:#92400e;background:var(--warn-bg);border:1px solid #fcd9a0;border-radius:8px;padding:8px 11px;}
  .m-trap b{color:var(--warn);}

  /* ---------- 页码徽标 ---------- */
  .chip.pg{background:#e8f6f2;color:var(--brand);font-weight:600;}

  /* ---------- 完成横幅 ---------- */
  .done-banner{
    margin-top:14px;border:1px solid #a7d9cf;background:#f0fbf9;border-radius:10px;
    padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .done-banner span{color:var(--brand);font-weight:700;font-size:15px;}
  .done-banner button{border-color:var(--brand);color:var(--brand);font-weight:600;}

  /* ---------- 思维导图弹窗 ---------- */
  #mapOverlay{
    position:fixed;inset:0;background:rgba(18,22,26,.55);z-index:50;
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  #mapOverlay.on{display:flex;}
  .map-card{
    background:var(--bg);border-radius:16px;max-width:96vw;max-height:94vh;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.25);
  }
  .map-head{padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .map-head b{font-size:16px;letter-spacing:.5px;}
  .map-head .hint{font-size:12px;color:var(--ink-3);}
  .map-scroll{overflow:auto;padding:6px;}
  #mapWrap svg{display:block;background:
    radial-gradient(circle at 50% 50%, #ffffff 0%, #f7f9fa 100%);}
  .leaf{cursor:pointer;}
  .leaf rect{transition:.15s;}
  .leaf:hover rect{stroke-width:2.5;filter:brightness(.96);}

  /* ---------- 概念详情弹窗 ---------- */
  #nodeOverlay{
    position:fixed;inset:0;background:rgba(18,22,26,.55);z-index:60;
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  #nodeOverlay.on{display:flex;}
  .node-card{
    background:#fff;border-radius:16px;width:min(640px,94vw);max-height:90vh;overflow:auto;
    padding:24px 28px;box-shadow:0 12px 48px rgba(0,0,0,.3);
  }
  .node-card .tags{margin-bottom:18px;}
  .node-card .tag{font-size:20px;padding:10px 16px;}
  .node-foot{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}

  @media print{
    header,.bar,.sc-foot,#stage{display:none!important;}
    #list{display:block!important;padding:0;}
    .grid{grid-template-columns:1fr 1fr;}
    .mini{break-inside:avoid;border-color:#999;}
    .m-ans{color:var(--ok)!important;background:#e8f6f2!important;}
  }
</style>
</head>
<body>

<header>
  <h1>高二生物 · 选择性必修一 TAG猜术语</h1>
  <span class="sub">期中复习 · 第1—4章 · 共 <span id="total"></span> 题（核心 <span id="coreNum"></span> 题）</span>
</header>

<div class="bar">
  <span class="tab on" id="modeStage" onclick="setMode('stage')">投屏复习卡</span>
  <span class="tab" id="modeList" onclick="setMode('list')">答案总表</span>
  <span style="width:1px;height:20px;background:var(--line);margin:0 6px;"></span>
  <span class="tab on" data-ch="all" onclick="setCh('all')">全部</span>
  <span class="tab c1" data-ch="1" onclick="setCh('1')">第1章 内环境</span>
  <span class="tab c2" data-ch="2" onclick="setCh('2')">第2章 神经</span>
  <span class="tab c3" data-ch="3" onclick="setCh('3')">第3章 体液</span>
  <span class="tab c4" data-ch="4" onclick="setCh('4')">第4章 免疫</span>
  <label class="chk"><input type="checkbox" id="onlyCore" onchange="applyFilter()">只看核心题</label>
  <span class="spacer"></span>
  <span class="counter" id="counter"></span>
  <button onclick="revealAll()">全部揭晓</button>
  <button onclick="openMap()" style="border-color:var(--brand);color:var(--brand);font-weight:600">思维导图</button>
  <button onclick="window.print()">打印 / 存PDF</button>
</div>

<main id="stage"></main>
<main id="list"></main>

<!-- 思维导图弹窗 -->
<div id="mapOverlay" onclick="if(event.target===this)closeMap()">
  <div class="map-card">
    <div class="map-head">
      <b>选择性必修1 · 概念导图（第1—4章）</b>
      <span class="hint">点任意概念可查看它的 3 个描述标签 · 点空白处关闭</span>
      <span class="spacer" style="flex:1"></span>
      <button onclick="closeMap()">关闭</button>
    </div>
    <div class="map-scroll"><div id="mapWrap"></div></div>
  </div>
</div>

<!-- 概念详情弹窗 -->
<div id="nodeOverlay" onclick="if(event.target===this)closeNode()">
  <div class="node-card" id="nodeCard"></div>
</div>

<script>
const DATA = [
/* ============ 第1章 内环境与稳态 ============ */
{ch:1,type:"概念",core:true,ask:"猜一个概念",
 tags:["#细胞直接生活于其中","#血浆、组织液、淋巴三件套","#体内细胞水灵灵地泡在里面的一池液体"],
 ans:"内环境（细胞外液）",pg:"P3–4",
 exp:"由<b>血浆、组织液、淋巴</b>等细胞外液构成、是体内细胞<b>直接生活</b>的液体环境。判断标准只有一条：看它是不是<b>细胞外液</b>。",
 trap:"呼吸道、消化道、尿道等与外界相通的管腔内的液体（唾液、胃液、尿液、泪液、汗液）<b>都不属于内环境</b>；单细胞生物和植物也没有内环境。还要注意：<b>血液≠血浆</b>，血液包含血浆和血细胞。"},

{ch:1,type:"概念",core:true,ask:"猜一个概念",
 tags:["#组成成分 + 理化性质双双达标","#是相对稳定，而非恒定不变","#内环境的六边形战士：每一项都稳"],
 ans:"稳态（内环境稳态）",pg:"P7",
 exp:"正常机体通过调节作用，使各器官、系统协调活动，共同维持<b>内环境的相对稳定状态</b>。稳态包含两个维度：<b>组成成分</b> + <b>理化性质</b>（渗透压、温度、酸碱度）。",
 trap:"答题必须写<b>“相对稳定”</b>，写“恒定”“不变”都判错；调节机制要写全<b>“神经—体液—免疫调节网络”</b>，只写神经调节扣分。"},

{ch:1,type:"概念",core:true,ask:"猜一个理化性质",
 tags:["#溶液中溶质微粒对水的吸引力","#微粒数目越多，抢水越凶","#Na⁺与Cl⁻贡献了九成以上"],
 ans:"渗透压",pg:"P5",
 exp:"指<b>溶液中溶质微粒对水的吸引力</b>。其大小取决于单位体积溶液中溶质微粒的<b>数目</b>，与微粒的大小无关。细胞外液渗透压的<b>90%以上</b>来源于<b>Na⁺和Cl⁻</b>。",
 trap:"血浆渗透压主要与<b>蛋白质和无机盐</b>有关；但“90%以上”那一问的标准答案是<b>Na⁺和Cl⁻</b>——两句话针对的是不同问题时，别混答。"},

{ch:1,type:"物质",core:false,ask:"猜一类物质",
 tags:["#专治乳酸上头","#H₂CO₃ / NaHCO₃ 挑大梁","#把血浆pH稳在7.35~7.45"],
 ans:"缓冲物质（缓冲对）",pg:"P8",
 exp:"血浆中存在<b>H₂CO₃/NaHCO₃（主要）</b>、NaH₂PO₄/Na₂HPO₄ 等缓冲对，能中和进入血液的酸性或碱性物质。剧烈运动产生的乳酸进入血液后与NaHCO₃反应，生成的H₂CO₃分解为CO₂由呼吸排出。",
 trap:"写具体物质时<b>NaHCO₃是主要的一对</b>，漏写会扣分；pH是<b>相对稳定</b>，不是绝对不变。"},

{ch:1,type:"现象",core:true,ask:"猜一种现象",
 tags:["#脸肿得像发面馒头","#营养不良、肾小球肾炎都是诱因","#水从血浆进入组织液并积压"],
 ans:"组织水肿",pg:"P10",
 exp:"<b>组织液渗透压升高</b>或<b>血浆渗透压下降</b>，引起水分从血浆进入组织液并积累。常见诱因：①营养不良（血浆蛋白减少）；②肾小球肾炎（蛋白尿）；③毛细淋巴管堵塞；④过敏反应（毛细血管通透性增大）；⑤局部组织代谢旺盛。",
 trap:"答“细胞内液增多”直接判错——增多的是<b>组织液</b>，属细胞外液。答题模板：<b>“血浆中的水分进入组织液，使组织液积累增多”</b>。"},

{ch:1,type:"物质",core:false,ask:"猜一种物质",
 tags:["#红细胞内的编制员工","#与血浆蛋白仅一字之差，命运不同","#属细胞内液，不算内环境成分"],
 ans:"血红蛋白",pg:"P4",
 exp:"血红蛋白存在于<b>红细胞内</b>，属于<b>细胞内液</b>成分，<b>不属于内环境</b>；血浆蛋白存在于血浆中，属于内环境成分。同理，呼吸酶（细胞内）、唾液淀粉酶（消化道）也都不属于内环境。",
 trap:"题目常问“不属于”。反例清单：<b>呼吸酶、血红蛋白（细胞内）、唾液淀粉酶（消化道）、尿液（与外界相通）</b>——这四项通常都不算；而<b>血浆蛋白、尿素、CO₂、葡萄糖、激素、神经递质</b>都属于内环境成分。"},

/* ============ 第2章 神经调节 ============ */
{ch:2,type:"概念",core:true,ask:"猜一个概念",
 tags:["#草履虫连参赛资格都没有","#中枢神经系统参与","#必须走完反射弧全程才作数"],
 ans:"反射",pg:"P23",
 exp:"在<b>中枢神经系统</b>参与下，机体对内外刺激所产生的<b>规律性应答反应</b>。判断两步：①是否有中枢神经系统参与；②是否经过<b>完整的反射弧</b>。",
 trap:"刺激传出神经引起肌肉收缩<b>不是</b>反射（未经过完整反射弧）；针扎手“感觉到痛”<b>不是</b>反射（只在传入神经—大脑皮层形成感觉，未经完整反射弧）；草履虫趋利避害也不是反射（无神经系统）。"},

{ch:2,type:"结构",core:false,ask:"猜一种结构",
 tags:["#反射弧的最后一棒","#传出神经末梢及其支配的肌肉或腺体","#两部分缺一不可"],
 ans:"效应器",pg:"P23",
 exp:"效应器 = <b>传出神经末梢及其所支配的肌肉或腺体</b>。反射弧五环节：感受器→传入神经→神经中枢→传出神经→效应器。",
 trap:"只写“肌肉”或只写“传出神经末梢”都不完整，<b>两部分必须同时答出</b>。"},

{ch:2,type:"概念",core:true,ask:"猜一类反射",
 tags:["#望梅止渴属于这挂的","#在非条件反射基础上经学习训练建立","#需要大脑皮层参与，不强化会消退"],
 ans:"条件反射",pg:"P25",
 exp:"在非条件反射的基础上，通过<b>学习和训练</b>建立的反射，需要<b>大脑皮层</b>参与。非条件反射大多终身不消退，条件反射可以消退。",
 trap:"望梅止渴、谈虎色变、听到上课铃走进教室=条件反射；膝跳反射、缩手反射、眨眼反射=非条件反射。判断关键是<b>是否通过学习训练而建立</b>，而不是简单地看有没有大脑参与。"},

{ch:2,type:"过程",core:true,ask:"猜一种电位",
 tags:["#K⁺：我先撤了，你们随意","#膜电位外正内负","#由K⁺顺浓度梯度外流造成，协助扩散不耗ATP"],
 ans:"静息电位",pg:"P28",
 exp:"神经纤维未受刺激时，膜主要对<b>K⁺</b>有通透性，K⁺顺浓度梯度<b>外流</b>，使膜电位表现为<b>外正内负</b>。",
 trap:"K⁺外流是<b>协助扩散</b>（经离子通道），<b>不消耗ATP</b>——这是选择题最爱设的坑，别写成主动运输。"},

{ch:2,type:"过程",core:true,ask:"猜一种电位",
 tags:["#膜电位当场倒戈","#由Na⁺迅速大量内流造成","#刺激要够强才触发"],
 ans:"动作电位",pg:"P28",
 exp:"受刺激时膜对<b>Na⁺</b>通透性增加，Na⁺迅速大量<b>内流</b>，膜电位由外正内负<b>逆转</b>为<b>外负内正</b>。",
 trap:"组织液<b>Na⁺</b>浓度升高→动作电位<b>峰值变大</b>；K⁺浓度升高→静息电位<b>绝对值变小</b>。这一对是表格题常客。"},

{ch:2,type:"过程",core:true,ask:"猜一种传导形式",
 tags:["#离体时来一场双向奔赴","#兴奋部位与未兴奋部位有电位差","#膜内电流同向，膜外反向"],
 ans:"局部电流（神经冲动的传导）",pg:"P28",

let mode="stage", curCh="all", idx=0, cur=[], revealed=false;

function esc(s){return s;}

function applyFilter(){
  const coreOnly=document.getElementById('onlyCore').checked;
  cur = DATA.filter(d=>(curCh==='all'||String(d.ch)===curCh)&&(!coreOnly||d.core));
  cur.forEach((d,i)=>d._n=i+1);
  if(idx>=cur.length) idx=0;
  if(mode==='stage') renderStage(); else renderList();
}

function setCh(c){
  curCh=c; idx=0;
  document.querySelectorAll('[data-ch]').forEach(t=>t.classList.toggle('on',t.dataset.ch===c));
  applyFilter();
}
function setMode(m){
  mode=m;
  document.getElementById('modeStage').classList.toggle('on',m==='stage');
  document.getElementById('modeList').classList.toggle('on',m==='list');
  document.getElementById('stage').style.display = m==='stage'?'flex':'none';
  document.getElementById('list').style.display  = m==='list' ?'block':'none';
  applyFilter();
}

function renderStage(){
  const stage=document.getElementById('stage');
  if(!cur.length){stage.innerHTML='<p style="color:var(--ink-3)">当前筛选下没有题目。</p>';return;}
  const d=cur[idx], c=CH[d.ch];
  document.getElementById('counter').textContent=`${idx+1} / ${cur.length}　（题库共 ${DATA.length} 题）`;
  const pgChip = d.pg==='拓展'
    ? '<span class="chip pg">拓展 · 教材外补充</span>'
    : `<span class="chip pg">课本 ${d.pg} 页</span>`;
  const doneBtn = (revealed && idx===cur.length-1)
    ? `<div class="done-banner"><span>这一轮刷完了！用概念导图做最后的总览复盘：</span><button onclick="openMap()">打开思维导图</button></div>`:'';
  const tags = d.tags.map(t=>`<span class="tag" style="color:${c.color};border-color:${c.color}40;background:${c.color}0d">${t}</span>`).join('');
  const dots = cur.map((x,i)=>`<span class="dot ${i===idx?'now':''}" onclick="go(${i})"></span>`).join('');
  stage.innerHTML = `
  <section class="stage-card">
    <div class="sc-top">
      <span class="chip ch" style="background:${c.color}">${c.name}</span>
      <span class="chip">${d.type}</span>
      <span class="chip">第 ${d._n} 题</span>
      ${d.core?'<span class="chip core">核心必考</span>':''}
      ${pgChip}
    </div>
    <div class="sc-body">
      <div class="ask">根据课本内容 · ${d.ask}</div>
      <div class="tags">${tags}</div>
      <div class="reveal-slot" id="slot">
        ${revealed?`
          <div class="ans-box">
            <div class="ans-name" style="color:${c.color}">${d.ans}</div>
            <div class="ans-meta">${c.name} · ${d.type} · ${d.pg==='拓展'?'拓展补充（教材未直接呈现）':'课本 '+d.pg+' 页 · 复习完可翻书对照'}</div>
            <div class="sec"><span class="sec-head">术语升华</span><br>${d.exp}</div>
            <div class="sec trap"><span class="sec-head">易错提醒</span><br>${d.trap}</div>
          </div>`:`
          <button class="reveal-btn" onclick="toggle()">点 击 揭 晓 答 案</button>`}
      </div>
      ${doneBtn}
    </div>
    <div class="sc-foot">
      <button onclick="step(-1)">← 上一题</button>
      <div class="dots">${dots}</div>
      <button onclick="step(1)">下一题 →</button>
    </div>
  </section>`;
}

function renderList(){
  const list=document.getElementById('list');
  document.getElementById('counter').textContent=`共 ${cur.length} 题`;
  list.innerHTML = `<div class="grid">` + cur.map(d=>{
    const c=CH[d.ch];
    return `<div class="mini">
      <div class="m-top">
        <span class="num">${String(d._n).padStart(2,'0')}</span>
        <span class="chip ch" style="background:${c.color};font-size:11px;padding:2px 8px">${c.name}</span>
        <span class="chip" style="font-size:11px;padding:2px 8px">${d.type}</span>
        ${d.core?'<span class="chip core" style="font-size:11px;padding:2px 8px">核心</span>':''}
        <span class="chip pg" style="font-size:11px;padding:2px 8px">${d.pg==='拓展'?'拓展':d.pg+' 页'}</span>
      </div>
      <div class="m-tags">${d.tags.map(t=>`<span class="m-tag" style="color:${c.color};background:${c.color}0f">${t}</span>`).join('')}</div>
      <div class="m-ans" onclick="this.classList.toggle('open')">${d.ans}<span style="font-size:12px;font-weight:600;color:var(--brand);opacity:.85;margin-left:8px">${d.pg==='拓展'?'（拓展）':'· '+d.pg}</span></div>
      <div class="m-exp"><b>讲解：</b>${d.exp}</div>
      <div class="m-trap"><b>易错：</b>${d.trap}</div>
    </div>`;
  }).join('') + `</div>`;
}

function go(i){idx=i;revealed=false;renderStage();}
function step(k){
  idx=(idx+k+cur.length)%cur.length; revealed=false; renderStage();
}
function toggle(){
  const wasRevealed=revealed;
  revealed=!revealed;renderStage();
  // 刷完最后一题 → 自动弹出思维导图
  if(!wasRevealed && revealed && cur.length && idx===cur.length-1){
    setTimeout(openMap,600);
  }
}
function revealAll(){
  revealed=true;
  if(mode==='list'){document.querySelectorAll('.m-ans').forEach(e=>e.classList.add('open'));}
  renderStage();
}

document.addEventListener('keydown',e=>{
  if(mode!=='stage') return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='Spacebar'){e.preventDefault();step(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
  else if(e.key==='Enter'){e.preventDefault();toggle();}
});

document.getElementById('total').textContent=DATA.length;
document.getElementById('coreNum').textContent=DATA.filter(d=>d.core).length;

  const H = Math.max(leftH,rightH) + 90;
  const midY = H/2;

  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC,Microsoft YaHei,sans-serif">`;

  function leafRect(x,y,w,label,color,idxInData){
    return `<g class="leaf" data-idx="${idxInData}">
      <rect x="${x}" y="${y}" width="${w}" height="${LEAF_H}" rx="8"
        fill="#ffffff" stroke="${color}" stroke-width="1.4"/>
      <text x="${x+w/2}" y="${y+LEAF_H/2+5}" text-anchor="middle"
        font-size="13.5" fill="#1c2024">${xesc(label)}</text>
    </g>`;
  }

  function branch(side, gi, gIdx){
    const g = groups[gi], color = CH[gi+1].color;
    const xLeaf = side==='L' ? 34 : W-34-COL_W;
    const xCh   = side==='L' ? 34+COL_W+44 : W-34-COL_W-44-CH_W;
    let totalH = g.length*(LEAF_H+GAP)-GAP;
    let y = gi<2 ? 60+(gi===0?0:groups[0].length*(LEAF_H+GAP)+SEC_GAP)
                 : 60+(gi===2?0:groups[2].length*(LEAF_H+GAP)+SEC_GAP);
    const yStart=y, yCh=y+totalH/2;
    let out='';
    g.forEach((d,k)=>{
      const idxInData = DATA.indexOf(d);
      const ly = y + k*(LEAF_H+GAP);
      // 连线：章节点 → 叶子
      const x1 = side==='L' ? xCh+CH_W : xCh, y1=yCh;
      const x2 = side==='L' ? xLeaf+COL_W : xLeaf, y2=ly+LEAF_H/2;
      const cx = (x1+x2)/2;
      out += `<path d="M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}"
        fill="none" stroke="${color}" stroke-width="1.1" opacity=".38"/>`;
      out += leafRect(xLeaf, ly, COL_W, shortName(d.ans), color, idxInData);
    });
    // 章节节点
    out += `<g class="branch">
      <rect x="${xCh}" y="${yCh-24}" width="${CH_W}" height="48" rx="24" fill="${color}"/>
      <text x="${xCh+CH_W/2}" y="${yCh+6}" text-anchor="middle" font-size="16"
        font-weight="700" fill="#fff">${CH[gi+1].name}</text>
    </g>`;
    // 章节节点 → 根
    const rx = side==='L' ? (W-ROOT_W)/2 : (W+ROOT_W)/2;
    const cx=(xCh+rx)/2;
    out += `<path d="M ${side==='L'?xCh:xCh+CH_W} ${yCh} C ${cx} ${yCh}, ${cx} ${midY}, ${rx} ${midY}"
      fill="none" stroke="${color}" stroke-width="2.2" opacity=".55"/>`;
    return out;
  }

  svg += branch('L',0);
  svg += branch('L',1);
  svg += branch('R',2);
  svg += branch('R',3);

  // 根节点
  svg += `<g>
    <rect x="${(W-ROOT_W)/2}" y="${midY-34}" width="${ROOT_W}" height="68" rx="16"
      fill="#1c2024"/>
    <text x="${W/2}" y="${midY-4}" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">选择性必修1</text>
    <text x="${W/2}" y="${midY+20}" text-anchor="middle" font-size="15" fill="#cfd6db">稳态与调节 · 第1—4章</text>
  </g>`;
  svg += '</svg>';
  document.getElementById('mapWrap').innerHTML = svg;

  // 点击叶子 → 概念详情
  document.querySelectorAll('#mapWrap .leaf').forEach(el=>{
    el.addEventListener('click',()=>showNode(DATA[+el.dataset.idx]));
  });
}

function openMap(){ buildMap(); document.getElementById('mapOverlay').classList.add('on'); }
function closeMap(){ document.getElementById('mapOverlay').classList.remove('on'); }

function showNode(d){
  const c=CH[d.ch];
  const pg = d.pg==='拓展' ? '拓展 · 教材外补充' : `课本 ${d.pg} 页 · 翻书对照`;
  document.getElementById('nodeCard').innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
      <span class="chip ch" style="background:${c.color}">${c.name}</span>
      <span class="chip">${d.type}</span>
      <span class="chip pg">${pg}</span>
    </div>
    <div class="tags">${d.tags.map(t=>`<span class="tag" style="color:${c.color};border-color:${c.color}40;background:${c.color}0d">${t}</span>`).join('')}</div>
    <div style="font-size:24px;font-weight:800;color:${c.color};margin-bottom:10px">${d.ans}</div>
    <div class="sec"><span class="sec-head">术语升华</span><br>${d.exp}</div>
    <div class="sec trap"><span class="sec-head">易错提醒</span><br>${d.trap}</div>
    <div class="node-foot">
      <button onclick="jumpTo(${DATA.indexOf(d)})" style="border-color:${c.color};color:${c.color}">去复习卡刷这题</button>
      <button onclick="closeNode()">关闭</button>
    </div>`;
  document.getElementById('nodeOverlay').classList.add('on');
}
function closeNode(){ document.getElementById('nodeOverlay').classList.remove('on'); }
function jumpTo(i){
  closeNode(); closeMap();
  if(mode!=='stage') setMode('stage');
  const pos = cur.indexOf(DATA[i]);
  go(pos>=0?pos:0);
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeNode();closeMap();}
});
</script>
</body>
</html>
